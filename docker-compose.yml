version: '3.8'

services:
  vidyodaya-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidyodaya-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-vidyodaya-super-secret-key-educational-production-2025-ai}
      - GEMINI_MODEL=gemini-2.5-flash
      - MAX_UPLOAD_SIZE_MB=25
    volumes:
      - vidyodaya-data:/app/backend/uploads
      - vidyodaya-db:/app/backend

volumes:
  vidyodaya-data:
  vidyodaya-db:
